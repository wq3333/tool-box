<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>ToolBox - 开发者工具箱</title>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script src="/libs/tailwindcss.js"></script>
    <script src="/libs/vue.js"></script>
    <script src="/libs/vue-router.js"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="app"></div>
    <script src="/js/api.js"></script>
    <script type="module" src="/js/components/FButton.js"></script>
    <script type="module" src="/js/components/FInput.js"></script>
    <script type="module" src="/js/components/FSingleSelect.js"></script>
    <script type="module" src="/js/components/icon.js"></script>
    <script type="module" src="/js/components/CopyButton.js"></script>
    <script type="module" src="/js/components/index.js"></script>
    <script type="module" src="/js/views/TimestampView.js"></script>
    <script type="module" src="/js/views/JsonView.js"></script>
    <script type="module" src="/js/views/EncryptionView.js"></script>
    <script type="module" src="/js/views/StringView.js"></script>
    <script type="module" src="/js/views/RegexView.js"></script>
    <script type="module" src="/js/views/EncodingView.js"></script>
    <script type="module" src="/js/views/HashView.js"></script>
    <script type="module" src="/js/views/JwtView.js"></script>
    <script type="module" src="/js/views/GuidView.js"></script>
    <script type="module" src="/js/views/HttpView.js"></script>
    <script type="module" src="/js/views/Base64View.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
